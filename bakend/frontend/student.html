<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="css/styles.css"> -->
    <title>Student Attendance</title>
    <script>
        // Classroom coordinates
        const classroomLatitude = 13.6561696;
        const classroomLongitude = 79.4816268;
        const allowedRadius = 0; // Increased radius slightly for GPS accuracy

        // Function to check if the student is in the classroom
        function checkLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        const distance = getDistanceFromLatLonInM(latitude, longitude, classroomLatitude, classroomLongitude);

                        console.log(`📍 Student Location: ${latitude}, ${longitude}`);
                        console.log(`📏 Distance from Classroom: ${distance.toFixed(2)} meters`);

                        // If within allowed radius, show attendance form
                        if (distance <= allowedRadius) {
                            document.getElementById("attendanceForm").style.display = "block";
                        } else {
                            alert("❌ You are outside the classroom. Attendance marking is not allowed.");
                            window.location.href = "error.html";
                        }
                    },
                    (error) => {
                        alert("⚠️ Geolocation is not enabled. Please enable it to mark attendance.");
                        window.location.href = "error.html";
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 } // Force fresh GPS data
                );
            } else {
                alert("❌ Geolocation is not supported by this browser.");
                window.location.href = "error.html";
            }
        }

        // Function to calculate distance between two lat/long coordinates
        function getDistanceFromLatLonInM(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Earth radius in meters
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c; // Distance in meters
        }
    </script>


<body onload="checkLocation()">

            padding: 0.7em;

            color: #e8e8e8;

            border-bottom: 2px solid #e8e8e8;
